[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    knolleary/PubSubClient@^2.8
    ayushsharma82/ElegantOTA@^3.1.6
    https://github.com/ESP32Async/AsyncTCP.git
    https://github.com/ESP32Async/ESPAsyncWebServer.git

build_flags =
    -D ELEGANTOTA_USE_ASYNC_WEBSERVER=1

; ---------------------------------------------------------------
; 上傳方式一：USB 燒錄（第一次一定要用這個，之後才能切換 OTA）
; 直接執行 `pio run -t upload` 即可，PlatformIO 會自動偵測 COM port
; 也可手動指定，例如: pio run -t upload --upload-port COM11
; ---------------------------------------------------------------

; ---------------------------------------------------------------
; 上傳方式二：Web OTA（透過 ElegantOTA，區網或 Tailscale 遠端都適用）
; 把下面兩行取消註解，並把 IP、帳密換成你自己的
; （Windows 用 curl.exe；macOS/Linux 用 curl）
;
; upload_protocol = custom
; upload_command = curl.exe -s -u OTA_USERNAME:OTA_PASSWORD "http://<ESP32_IP>/ota/start" && curl.exe -u OTA_USERNAME:OTA_PASSWORD -F "file=@$SOURCE" "http://<ESP32_IP>/ota/upload"
; ---------------------------------------------------------------
